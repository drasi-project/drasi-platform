[project]
name = "drasi-reaction-sdk"
version = "0.1.0-alpha"
description = "Reaction SDK for Project Drasi"
license = "Apache-2.0"
authors = [
    { name = "Steve Russo", email = "64294847+sjrusso8@users.noreply.github.com" },
]
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "dapr>=1.14.0,<2.0.0",
    "dapr-ext-fastapi>=1.14.0,<2.0.0",
    "fastapi>=0.115.4,<1.0.0",
    "PyYAML==6.0.2",
    "pydantic>=2.10.0,<3.0.0",
]

[project.urls]
Homepage = "https://drasi.io"
Repository = "https://github.com/drasi-project/drasi-platform"

[dependency-groups]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "datamodel-code-generator==0.64.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["drasi"]

[tool.hatch.build]
exclude = ["examples/**"]
