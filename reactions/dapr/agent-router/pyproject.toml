[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-router"
version = "0.1.0"
description = "DaprAgentRouter reaction protocol contracts"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "jsonschema>=4.23,<5",
    "pydantic>=2.10,<3",
    "referencing>=0.28.4,<1",
]

[dependency-groups]
dev = [
    "datamodel-code-generator==0.76.2",
]
test = [
    "pytest>=8,<9",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"agent_router.protocol" = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
