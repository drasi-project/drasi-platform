[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-router"
version = "0.1.0"
description = "Dapr Agent Router Reaction"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "dapr==1.18.1",
    "drasi-reaction-sdk",
    "fastapi==0.140.13",
    "fastmcp-slim[server]==3.4.4",
    "pydantic==2.13.4",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

# TODO: remove this once Python SDK updates land
[tool.uv.sources]
drasi-reaction-sdk = { path = "../../sdk/python", editable = true }
