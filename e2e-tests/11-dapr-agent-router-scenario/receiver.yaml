apiVersion: v1
kind: ConfigMap
metadata:
  name: i460-agent-receiver
  namespace: default
data:
  receiver.py: |
    import base64
    import json
    import threading
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    records = []
    records_lock = threading.Lock()

    class Handler(BaseHTTPRequestHandler):
        protocol_version = "HTTP/1.1"

        def send_json(self, status, document):
            body = json.dumps(document, separators=(",", ":")).encode()
            self.send_response(status)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        def send_path_error(self, status, message):
            self.send_json(status, {"error": message})

        def do_GET(self):
            if self.path == "/healthz":
                self.send_json(200, {"status": "ready"})
                return
            if self.path == "/records":
                with records_lock:
                    snapshot = [
                        {
                            "id": record_id,
                            "body_base64": base64.b64encode(body).decode("ascii"),
                        }
                        for record_id, body in records
                    ]
                self.send_json(200, {"records": snapshot})
                return
            self.send_path_error(404, "unsupported path")

        def do_POST(self):
            if self.path != "/events":
                self.send_path_error(404, "unsupported path")
                return
            length_header = self.headers.get("Content-Length")
            try:
                length = int(length_header)
            except (TypeError, ValueError):
                self.send_path_error(400, "valid Content-Length is required")
                return
            if length <= 0:
                self.send_path_error(400, "request body is required")
                return
            if length > 1024 * 1024:
                self.send_path_error(413, "request body is too large")
                return
            body = self.rfile.read(length)
            if len(body) != length:
                self.send_path_error(400, "request body is incomplete")
                return
            try:
                cloud_event = json.loads(body)
            except (UnicodeDecodeError, json.JSONDecodeError):
                self.send_path_error(400, "request body must be valid JSON")
                return
            required = {
                "id",
                "source",
                "specversion",
                "type",
                "topic",
                "pubsubname",
                "data",
            }
            if not isinstance(cloud_event, dict) or not required.issubset(cloud_event):
                self.send_path_error(400, "request body must be a Dapr CloudEvent")
                return
            with records_lock:
                record_id = len(records) + 1
                records.append((record_id, body))
            self.send_json(200, {"status": "SUCCESS"})

        def do_PUT(self):
            self.send_path_error(405, "method not allowed")

        def do_DELETE(self):
            self.send_path_error(405, "method not allowed")

        def do_PATCH(self):
            self.send_path_error(405, "method not allowed")

        def log_message(self, format, *args):
            print("%s - %s" % (self.address_string(), format % args), flush=True)

    ThreadingHTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
---
apiVersion: v1
kind: Service
metadata:
  name: i460-agent-receiver
  namespace: default
spec:
  selector:
    app: i460-agent-receiver
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: dapr.io/v2alpha1
kind: Subscription
metadata:
  name: i460-agent-receiver
  namespace: default
spec:
  pubsubname: i460-agent-egress
  topic: __I460_INBOX_TOPIC__
  routes:
    default: /events
scopes:
  - i460-e2e-reader
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: i460-agent-receiver
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: i460-agent-receiver
  template:
    metadata:
      labels:
        app: i460-agent-receiver
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: i460-e2e-reader
        dapr.io/app-port: "8080"
        dapr.io/app-protocol: http
    spec:
      containers:
        - name: receiver
          image: python:3.12.7-alpine3.20
          imagePullPolicy: IfNotPresent
          command:
            - python
            - /app/receiver.py
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 1
            periodSeconds: 2
          volumeMounts:
            - name: receiver
              mountPath: /app
              readOnly: true
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
      volumes:
        - name: receiver
          configMap:
            name: i460-agent-receiver
